<!doctype html>
<html lang="th" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คิวเตรียมสารหลอมแก้ว</title>
<script>document.documentElement.dataset.bsTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar brand-bar mb-4 shadow-sm">
  <div class="container-xl">
    <span class="navbar-brand"><i class="bi bi-fire me-2"></i>คิวเตรียมสารหลอมแก้ว</span>
    <small id="meta">กำลังโหลด…</small>
  </div>
</nav>

<main class="container-xl pb-5">
  <div id="alert"></div>
  <div id="loading" class="text-center py-5"><div class="spinner-border text-primary" role="status"></div></div>
  <div id="app" class="d-none">
    <div id="stats" class="row g-3 mb-4"></div>

    <div class="card mb-4">
      <div class="card-header bg-body d-flex align-items-center">
        <h2 class="h6 mb-0"><i class="bi bi-calendar3 me-2 text-primary"></i>ปฏิทินเตา 14 วัน</h2>
      </div>
      <div class="table-responsive">
        <table class="table table-bordered table-sm mb-0 cal" id="cal"></table>
      </div>
    </div>

    <div class="card">
      <div class="card-header bg-body">
        <div class="d-flex flex-wrap align-items-center gap-2">
          <h2 class="h6 mb-0 me-auto"><i class="bi bi-box-seam me-2 text-primary"></i>รายการทั้งหมด <span id="count" class="badge text-bg-secondary"></span></h2>
          <input id="fq" type="search" class="form-control form-control-sm" style="max-width:12rem" placeholder="ค้นหา batch / สูตร">
          <select id="fs" class="form-select form-select-sm w-auto"></select>
          <select id="ff" class="form-select form-select-sm w-auto"></select>
          <select id="fp" class="form-select form-select-sm w-auto"></select>
          <div class="form-check form-switch mb-0 ms-1">
            <input class="form-check-input" type="checkbox" id="fu" checked>
            <label class="form-check-label small" for="fu">เฉพาะงานที่ยังไม่เสร็จ</label>
          </div>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light"><tr>
            <th>วันหลอม</th><th>เตา</th><th>Batch</th><th>สถานะ</th><th>ผู้เตรียม</th><th>สูตร</th><th>ตัวอย่าง</th><th>โปรไฟล์</th><th class="text-end">ไฟล์</th>
          </tr></thead>
          <tbody id="q"></tbody>
        </table>
      </div>
      <div id="empty" class="text-center text-body-secondary py-4 d-none">ไม่มีรายการตามตัวกรอง</div>
    </div>
  </div>
</main>

<script src="config.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const STYLE = {
    queued: ['warning', 'hourglass-split'], weighed: ['info', 'speedometer2'], melted: ['danger', 'fire'],
    done: ['success', 'check2-circle'], cancelled: ['secondary', 'x-circle'],
  };
  const fail = text => {
    $('loading').classList.add('d-none');
    $('alert').innerHTML = '<div class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i>' + text + '</div>';
    $('meta').textContent = '';
  };
  const key = new URLSearchParams(location.search).get('k') || '';
  if (!key) return fail('ลิงก์ไม่ครบ ขอลิงก์ Dashboard จากบอท LINE (พิมพ์ <b>dashboard</b>)');

  glassApi({ a: 'dash', k: key }).then(render).catch(e => fail('โหลดข้อมูลไม่สำเร็จ: ' + esc(e.message)));

  function render(d) {
    if (!d.ok) return fail(esc(d.error));
    $('loading').classList.add('d-none');
    $('app').classList.remove('d-none');
    $('meta').textContent = 'อัปเดต ' + d.now;

    const label = s => d.status[s] || s;
    const badge = s => {
      const st = STYLE[s] || ['secondary', 'circle'];
      return '<span class="badge rounded-pill text-bg-' + st[0] + '">' + esc(label(s)) + '</span>';
    };
    const active = d.batches.filter(b => b.status !== 'cancelled');
    const today = new Date();
    const iso = dt => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
    const todayIso = iso(today);

    // การ์ดสรุปตามสถานะ
    $('stats').innerHTML = d.flow.map(s => {
      const st = STYLE[s] || ['secondary', 'circle'];
      return '<div class="col-6 col-lg-3"><div class="card stat-card h-100"><div class="card-body d-flex align-items-center gap-3">' +
        '<div class="icon bg-' + st[0] + '-subtle text-' + st[0] + '-emphasis"><i class="bi bi-' + st[1] + '"></i></div>' +
        '<div><div class="small text-body-secondary">' + esc(label(s).replace(/^\S+\s/, '')) + '</div>' +
        '<div class="value">' + active.filter(b => b.status === s).length + '</div></div></div></div></div>';
    }).join('');

    // ปฏิทินเตา
    let cal = '<thead class="table-light"><tr><th>วันที่</th>' + d.furnaces.map(f => '<th>' + esc(f) + '</th>').join('') + '</tr></thead><tbody>';
    for (let i = 0; i < 14; i++) {
      const day = iso(new Date(today.getFullYear(), today.getMonth(), today.getDate() + i));
      cal += '<tr' + (i === 0 ? ' class="today"' : '') + '><td class="text-nowrap">' + thaiDate(day) + (i === 0 ? ' <span class="badge text-bg-primary">วันนี้</span>' : '') + '</td>' +
        d.furnaces.map(f => {
          const here = active.filter(b => b.furnace === f && b.meltDate === day);
          return here.length
            ? '<td class="busy">' + here.map(b => '<span class="chip"><b>' + esc(b.batchId) + '</b> · ' + esc(b.userName) + '</span>').join('') + '</td>'
            : '<td></td>';
        }).join('') + '</tr>';
    }
    $('cal').innerHTML = cal + '</tbody>';

    // ตัวกรอง
    const opts = (first, list) => '<option value="">' + first + '</option>' + list.map(o => '<option value="' + esc(o[0]) + '">' + esc(o[1]) + '</option>').join('');
    $('fs').innerHTML = opts('ทุกสถานะ', Object.keys(d.status).map(s => [s, label(s)]));
    $('ff').innerHTML = opts('ทุกเตา', d.furnaces.map(f => [f, f]));
    $('fp').innerHTML = opts('ทุกคน', [...new Set(d.batches.map(b => b.userName))].map(p => [p, p]));

    // ตารางรายการ
    $('q').innerHTML = d.batches.slice().sort((a, b) => a.meltDate.localeCompare(b.meltDate)).map(b => {
      const files = [['file-earmark-spreadsheet', 'Excel', b.xlsxUrl, 'success'], ['file-earmark-text', 'ใบชั่ง', b.weighPdfUrl, 'primary'], ['qr-code', 'ป้าย', b.labelPdfUrl, 'dark']]
        .filter(f => f[2]).map(f => '<a class="btn btn-sm btn-outline-' + f[3] + '" href="' + esc(f[2]) + '" target="_blank" rel="noopener" title="' + f[1] + '"><i class="bi bi-' + f[0] + '"></i></a>').join('');
      const late = b.meltDate < todayIso && b.status === 'queued' ? ' <i class="bi bi-exclamation-triangle-fill text-warning" title="เลยวันหลอมแล้ว"></i>' : '';
      const search = (b.batchId + ' ' + b.formula + ' ' + b.codes + ' ' + b.preparer).toLowerCase();
      return '<tr data-s="' + esc(b.status) + '" data-f="' + esc(b.furnace) + '" data-p="' + esc(b.userName) + '" data-q="' + esc(search) + '">' +
        '<td class="text-nowrap">' + thaiDate(b.meltDate) + late + '</td><td class="text-nowrap">' + esc(b.furnace) + '</td>' +
        '<td class="fw-semibold text-nowrap">' + esc(b.batchId) + '</td><td>' + badge(b.status) + '</td><td>' + esc(b.preparer) + '</td>' +
        '<td class="formula">' + esc(b.formula) + '</td><td class="small">' + esc(b.codes.split(',').join(', ')) + '</td>' +
        '<td class="small text-nowrap">' + esc(b.profile) + '</td><td class="text-end"><div class="btn-group">' + files + '</div></td></tr>';
    }).join('');

    const filter = () => {
      const s = $('fs').value, f = $('ff').value, p = $('fp').value, u = $('fu').checked, q = $('fq').value.trim().toLowerCase();
      let shown = 0;
      document.querySelectorAll('#q tr').forEach(r => {
        const ok = (!s || r.dataset.s === s) && (!f || r.dataset.f === f) && (!p || r.dataset.p === p) &&
          (!u || (r.dataset.s !== 'done' && r.dataset.s !== 'cancelled')) && (!q || r.dataset.q.indexOf(q) >= 0);
        r.classList.toggle('d-none', !ok);
        if (ok) shown++;
      });
      $('count').textContent = shown;
      $('empty').classList.toggle('d-none', shown > 0);
    };
    ['fs', 'ff', 'fp', 'fu'].forEach(id => $(id).addEventListener('change', filter));
    $('fq').addEventListener('input', filter);
    filter();
  }
})();
</script>
</body>
</html>
