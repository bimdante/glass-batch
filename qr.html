<!doctype html>
<html lang="th" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ข้อมูลตัวอย่างแก้ว</title>
<script>document.documentElement.dataset.bsTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container py-4" style="max-width:34rem">
  <div class="card overflow-hidden">
    <div class="brand-bar p-4 text-center">
      <div class="small opacity-75"><i class="bi bi-qr-code-scan me-1"></i>ตัวอย่างแก้ว</div>
      <div id="code" class="code-hero">-</div>
      <span id="batch" class="badge rounded-pill bg-light text-dark"></span>
    </div>
    <div class="card-body p-4">
      <form id="form" autocomplete="off">
        <label for="pin" class="form-label fw-semibold"><i class="bi bi-lock me-1"></i>ใส่รหัสเพื่อดูสูตรแก้ว</label>
        <div class="input-group input-group-lg">
          <input id="pin" type="password" class="form-control pin-input" autocapitalize="off" spellcheck="false" maxlength="12" placeholder="รหัส" required>
          <button id="go" class="btn btn-primary px-4" type="submit">ดูสูตร</button>
        </div>
      </form>
      <div id="msg" class="mt-3" role="status"></div>
      <div id="out"></div>
    </div>
  </div>
  <p class="text-center text-body-secondary small mt-3 mb-0">ระบบเตรียมสารหลอมแก้ว · ข้อมูลจาก LINE bot</p>
</main>
<script src="config.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const b = q.get('b') || '', c = q.get('c') || '';
  $('code').textContent = c || '-';
  $('batch').textContent = b;
  $('pin').focus();

  const alert = (kind, html) => { $('msg').innerHTML = '<div class="alert alert-' + kind + ' py-2 mb-0">' + html + '</div>'; };

  $('form').addEventListener('submit', ev => {
    ev.preventDefault();
    $('go').disabled = true;
    $('out').innerHTML = '';
    $('msg').innerHTML = '<div class="text-center"><div class="spinner-border spinner-border-sm text-primary me-2"></div>กำลังตรวจสอบ…</div>';
    glassApi({ a: 'qr', b: b, code: c, pin: $('pin').value }).then(r => {
      if (!r.ok) { alert('danger', '<i class="bi bi-x-circle me-1"></i>' + esc(r.error)); return; }
      $('msg').innerHTML = '';
      $('form').classList.add('d-none');
      let h = '<div class="list-group list-group-flush mb-4">' + r.info.map(kv =>
        '<div class="list-group-item px-0 d-flex gap-3"><span class="text-body-secondary flex-shrink-0" style="min-width:6.5rem">' + esc(kv[0]) +
        '</span><span class="fw-semibold text-break">' + esc(kv[1]) + '</span></div>').join('') + '</div>';
      h += '<h3 class="h6 fw-semibold"><i class="bi bi-list-ul me-1 text-primary"></i>องค์ประกอบ</h3>' +
        '<div class="table-responsive"><table class="table table-sm table-striped align-middle mb-0">' +
        '<thead class="table-light"><tr><th>ออกไซด์</th><th class="num">mol%</th><th>สารตั้งต้น</th><th class="num">g</th></tr></thead><tbody>' +
        r.rows.map(x => '<tr><td class="fw-semibold">' + esc(x[0]) + '</td><td class="num">' + esc(x[1]) + '</td><td>' + esc(x[2]) + '</td><td class="num">' + esc(x[3]) + '</td></tr>').join('') +
        '</tbody></table></div>';
      $('out').innerHTML = h;
    }).catch(e => alert('warning', 'เชื่อมต่อไม่สำเร็จ: ' + esc(e.message)))
      .finally(() => { $('go').disabled = false; });
  });
})();
</script>
</body>
</html>
